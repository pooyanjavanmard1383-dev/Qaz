const el=new Audio();el.preload='auto';

let AC=null;const G={};
function makeIR(ctx,sec){const n=Math.max(1,Math.floor(ctx.sampleRate*sec));const b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6)}return b}
function initAudio(){
  if(AC)return;
  const C=window.AudioContext||window.webkitAudioContext;
  AC=new C({latencyHint:'playback'});
  const src=AC.createMediaElementSource(el);
  G.pre=AC.createGain();
  G.f=EQF.map((f,i)=>{const b=AC.createBiquadFilter();b.type=i===0?'lowshelf':(i===9?'highshelf':'peaking');b.frequency.value=f;b.Q.value=1.1;return b});
  G.dry=AC.createGain();G.wet=AC.createGain();G.conv=AC.createConvolver();G.mix=AC.createGain();
  G.pan=AC.createStereoPanner();G.osc=AC.createOscillator();G.oscG=AC.createGain();
  G.comp=AC.createDynamicsCompressor();G.vol=AC.createGain();G.an=AC.createAnalyser();
  G.an.fftSize=2048;G.an.smoothingTimeConstant=0.62;
  src.connect(G.pre);let p=G.pre;G.f.forEach(f=>{p.connect(f);p=f});
  p.connect(G.dry);p.connect(G.conv);G.conv.connect(G.wet);
  G.dry.connect(G.mix);G.wet.connect(G.mix);G.mix.connect(G.pan);G.pan.connect(G.comp);
  G.comp.connect(G.an);G.comp.connect(G.vol);G.vol.connect(AC.destination);
  G.osc.type='sine';G.osc.connect(G.oscG);G.oscG.connect(G.pan.pan);G.osc.start();
  G.conv.buffer=makeIR(AC,S.revT);
  applyFx();
}
let irT=0;
function applyFx(){
  el.defaultPlaybackRate=S.rate;el.playbackRate=S.rate;
  try{el.preservesPitch=!!S.lock;el.webkitPreservesPitch=!!S.lock}catch(e){}
  el.loop=(S.loop===2);
  if(!AC)return;
  const t=AC.currentTime;
  G.f.forEach((f,i)=>f.gain.setTargetAtTime(S.eqOn?S.eq[i]:0,t,0.03));
  G.wet.gain.setTargetAtTime(S.rev*0.95,t,0.05);
  G.dry.gain.setTargetAtTime(1-S.rev*0.3,t,0.05);
  G.oscG.gain.setTargetAtTime(S.d8?0.95:0,t,0.2);
  G.osc.frequency.setTargetAtTime(S.d8s,t,0.1);
  G.vol.gain.setTargetAtTime(S.vol,t,0.03);
  const c=G.comp;
  if(S.comp){c.threshold.value=-26;c.knee.value=24;c.ratio.value=5;c.attack.value=0.004;c.release.value=0.22;G.pre.gain.setTargetAtTime(1.25,t,0.05)}
  else{c.threshold.value=0;c.knee.value=0;c.ratio.value=1;G.pre.gain.setTargetAtTime(1,t,0.05)}
}

  const t=cur();if(!t)return;
  initAudio();
  el.pause();el.src=trackUrl(t);el.defaultPlaybackRate=S.rate;el.playbackRate=S.rate;el.load();
  ab.a=ab.b=null;songAcc=0;counted=false;resetBeat();
  if(auto)doPlay();

function doPlay(){
  initAudio();
  // Resume WebAudio before starting the media element. On Android WebView,
  // calling play() while the AudioContext is still suspended can look like a silent track.
  let ready=Promise.resolve();
  try{if(AC&&AC.state!=='running')ready=AC.resume()}catch(e){}
  ready.then(()=>{
    const p=el.play();
    if(p&&p.catch)p.catch(err=>{console.warn('NYXORA playback:',err);toast('پخش انجام نشد؛ فرمت یا دسترسی فایل را بررسی کن')});
  }).catch(err=>{console.warn('NYXORA audio context:',err);toast('راه‌اندازی صدا ناموفق بود')});
}
function playQueue(list,i){Q=list.slice();qi=i;hist=[];loadCur(true)}
function togglePlay(){if(!cur())return;if(el.paused)doPlay();else el.pause()}
function nextIdx(){if(!Q.length)return -1;if(S.shuf){if(Q.length===1)return 0;let k;do{k=Math.floor(Math.random()*Q.length)}while(k===qi);return k}if(qi+1<Q.length)return qi+1;return S.loop===1?0:-1}

function prev(){if(el.currentTime>3){el.currentTime=0;return}if(hist.length){qi=hist.pop()}else if(qi>0){qi--}else{el.currentTime=0;return}loadCur(true)}

let sleep={end:0,t:0,fade:true};

  clearInterval(sleep.t);sleep.end=0;if(G.vol)G.vol.gain.setTargetAtTime(S.vol,AC.currentTime,.05);

// ===================== live analysis + beat =====================
const F=new Uint8Array(1024),T=new Uint8Array(2048);
const A={bass:0,mid:0,treb:0,lvl:0,beat:0,bpm:0,F,T,t:0,dt:0.016,on:false};
let bh=[],lastBeat=0,bIv=[],bPrev=0;

function medianBpm(){if(bIv.length<6)return 0;const s=bIv.slice().sort((a,b)=>a-b);let iv=s[s.length>>1];let b=60000/iv;while(b<70)b*=2;while(b>180)b/=2;return Math.round(b)}
function analyse(now){
  A.beat*=0.88;
  if(!G.an||el.paused){A.bass*=.9;A.mid*=.9;A.treb*=.9;A.lvl*=.9;A.on=false;return}
  A.on=true;
  G.an.getByteFrequencyData(F);G.an.getByteTimeDomainData(T);
  let b=0,m=0,t=0;
  for(let i=1;i<=6;i++)b+=F[i];b/=6*255;
  for(let i=8;i<60;i++)m+=F[i];m/=52*255;
  for(let i=60;i<300;i++)t+=F[i];t/=240*255;
  A.bass+=(b-A.bass)*.5;A.mid+=(m-A.mid)*.4;A.treb+=(t-A.treb)*.4;
  let s=0;for(let i=0;i<2048;i+=4){const v=(T[i]-128)/128;s+=v*v}A.lvl=Math.sqrt(s/512);
  bh.push(b);if(bh.length>40)bh.shift();

function analyzeSamples(x,sr){
  const n=x.length;const P=240,seg=Math.max(1,Math.floor(n/P));
  const raw=new Float32Array(P);let mx=1e-6;
  for(let p=0;p<P;p++){let m=0;const s0=p*seg,e0=Math.min(n,s0+seg);for(let i=s0;i<e0;i+=2){const v=Math.abs(x[i]);if(v>m)m=v}raw[p]=m;if(m>mx)mx=m}
  const pk=new Uint8Array(P);for(let p=0;p<P;p++)pk[p]=Math.round(Math.pow(raw[p]/mx,0.7)*255);
  let ss=0,zc=0,pv=0;for(let i=0;i<n;i++){const v=x[i];ss+=v*v;if((v>=0)!==(pv>=0))zc++;pv=v}
  const en=clamp(Math.sqrt(ss/n)/0.22),br=clamp((zc/n)/0.12);
  const hop=Math.max(1,Math.round(sr*0.01)),m=Math.floor(n/hop);
  const env=new Float32Array(m);const a=1-Math.exp(-2*Math.PI*180/sr);let y=0;
  for(let j=0;j<m;j++){let s=0;const o=j*hop;for(let k=0;k<hop;k++){y+=a*(x[o+k]-y);s+=y*y}env[j]=Math.sqrt(s/hop)}
  const on=new Float32Array(m);for(let j=1;j<m;j++){const d=env[j]-env[j-1];on[j]=d>0?d:0}
  const st=Math.max(0,Math.floor(m/2-3000)),en2=Math.min(m,st+6000);
  let bpm=0;
  if(en2-st>1200){
    const sc=new Float32Array(102);
    for(let l=28;l<=100;l++){let s=0;for(let j=st;j+l<en2;j++)s+=on[j]*on[j+l];const bp=6000/l;const w=Math.exp(-0.5*Math.pow(Math.log2(bp/118)/0.55,2));sc[l]=s/(en2-st-l)*w}
    let bl=0,bs=0;for(let l=29;l<=99;l++){if(sc[l]>bs){bs=sc[l];bl=l}}
    if(bl&&bs>0){const d=sc[bl-1]-2*sc[bl]+sc[bl+1];const off=d!==0?0.5*(sc[bl-1]-sc[bl+1])/d:0;bpm=Math.round(6000/(bl+clamp(off,-0.5,0.5)))}
  }
  let bin='';for(let i=0;i<P;i++)bin+=String.fromCharCode(pk[i]);
  return [bpm,Math.round(en*100)/100,Math.round(br*100)/100,btoa(bin)];
}
let anCtx=null,anChain=Promise.resolve();
function analyzeTrack(t){
  anChain=anChain.then(async()=>{
    if(AN[t.id])return AN[t.id];

      if(ab_.byteLength>45e6)return null;
      const O=window.OfflineAudioContext||window.webkitOfflineAudioContext;

      const buf=await anCtx.decodeAudioData(ab_);

      if(buf.numberOfChannels>1){const c1=buf.getChannelData(1);for(let i=0;i<x.length;i++)x[i]=(c0[i]+c1[i])*.5}else x.set(c0);

function decodePk(t){
  if(!t){curPk=null;curPkId=null;return}
  const a=AN[t.id];if(a&&a[3]){try{const b=atob(a[3]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);curPk=u;curPkId=t.id;return}catch(e){}}
  curPk=null;curPkId=t.id;
}
function drawWave(t){
  sizeCanvas($('wcv'),WV);const c=WV.c,w=WV.w,h=WV.h;c.clearRect(0,0,w,h);
  const th=THEMES[sceneKey()]||THEMES.ring;
  const n=Math.max(20,Math.floor(w/5)),d=el.duration||0,p=dragF!=null?dragF:(d?clamp(el.currentTime/d):0);
  const tr=cur();const seed=tr?hash(String(tr.id)):1;
  for(let i=0;i<n;i++){
    const f=(i+0.5)/n;let amp;
    if(curPk){amp=curPk[Math.min(curPk.length-1,Math.floor(f*curPk.length))]/255}
    else amp=0.18+0.12*Math.sin(t*3+i*0.5+seed%7)*0.5+0.12*(0.5+0.5*Math.sin(t*1.3-i*0.3));
    const hh=Math.max(3,amp*h*0.95);const x=w-f*w;
    const played=f<=p;
    c.fillStyle=played?mixc(th.a,th.b,f,1):'rgba(255,255,255,.26)';
    c.beginPath();c.roundRect?c.roundRect(x-1.5,(h-hh)/2,3,hh,1.5):c.rect(x-1.5,(h-hh)/2,3,hh);c.fill();
  }
  if(d){
    c.fillStyle=th.b;
    for(const m of [ab.a,ab.b]){if(m!=null){const x=w-(m/d)*w;c.fillRect(x-1,0,2,h)}}
    const px=w-p*w;c.fillStyle='#fff';c.fillRect(px-1,2,2,h-4);
  }
}

function loadLibrary(ask){

$('file').onchange=e=>{

    const tr={id,t,a,al:'',d:0,y:f.lastModified||0,u:URL.createObjectURL(f)};
    const au=new Audio();au.preload='metadata';au.src=tr.u;au.onloadedmetadata=()=>{tr.d=au.duration*1000;paintRows()};return tr});

// ---------- waveform seek ----------
(function(){
  const w=$('wave');let drag=false;
  const frac=e=>{const r=w.getBoundingClientRect();return clamp(1-(e.clientX-r.left)/r.width)};
  w.addEventListener('pointerdown',e=>{drag=true;w.setPointerCapture(e.pointerId);dragF=frac(e)});
  w.addEventListener('pointermove',e=>{if(drag)dragF=frac(e)});
  const up=e=>{if(!drag)return;drag=false;if(dragF!=null)seekTo(dragF);dragF=null};
  w.addEventListener('pointerup',up);w.addEventListener('pointercancel',()=>{drag=false;dragF=null});
})();

// ---------- stage gestures ----------
(function(){
  const st=$('stage');let sx=0,sy=0,t0=0,moved=false,vol0=1,mode='',lp=0,lastTap=0,lastX=0;
  st.addEventListener('pointerdown',e=>{
    st.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;t0=performance.now();moved=false;mode='';vol0=S.vol;
    clearTimeout(lp);lp=setTimeout(()=>{if(!moved){mode='lp';punch();if(navigator.vibrate)navigator.vibrate(20)}},600);
  });
  st.addEventListener('pointermove',e=>{
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(!mode&&(Math.abs(dx)>14||Math.abs(dy)>14)){moved=true;clearTimeout(lp);mode=Math.abs(dy)>Math.abs(dx)?'v':'h'}
    if(mode==='v'){S.vol=clamp(vol0-dy/(st.clientHeight*0.7),0,1);applyFx();hud('صدا '+fa(Math.round(S.vol*100))+'٪')}
  });
  st.addEventListener('pointerup',e=>{
    clearTimeout(lp);const dx=e.clientX-sx,dt=performance.now()-t0;
    if(mode==='h'&&Math.abs(dx)>70&&dt<650){if(dx<0)next();else prev();return}
    if(mode==='v'){saveS();return}
    if(mode===''&&dt<350){
      const n=performance.now();
      if(n-lastTap<320&&Math.abs(e.clientX-lastX)<50){
        lastTap=0;const r=st.getBoundingClientRect(),f=(e.clientX-r.left)/r.width;
        if(f<0.33){seekBy(-10);hud('۱۰ ثانیه عقب')}else if(f>0.67){seekBy(10);hud('۱۰ ثانیه جلو')}
        else{$('nFav').click();hud(FAV.has(cur().id)?'به علاقه‌مندی‌ها اضافه شد':'برداشته شد')}
      }else{lastTap=n;lastX=e.clientX}
    }
  });
})();

function openQueue(){
  const rows=Q.map((t,i)=>'<div class="q" data-q="'+i+'"><div class="info"><div class="t1" style="'+(i===qi?'color:var(--a)':'')+'">'+esc(t.t)+'</div><div class="t2">'+esc(t.a||'ناشناس')+'</div></div>'+(i===qi?'':'<button class="ib" data-d="'+i+'" style="width:36px;height:36px;font-size:18px">'+ic('close')+'</button>')+'</div>').join('');
  openSheet('صف پخش ('+fa(Q.length)+')',rows||'<div class="empty">صف خالی است</div>',b=>{
    b.querySelectorAll('[data-d]').forEach(x=>x.onclick=e=>{e.stopPropagation();const i=+x.dataset.d;Q.splice(i,1);if(i<qi)qi--;openQueue()});
    b.querySelectorAll('.q').forEach(x=>x.onclick=()=>{qi=+x.dataset.q;hist=[];loadCur(true);closeSheet()});
    const c=b.querySelector('.q [style*="--a"]');if(c)c.scrollIntoView({block:'center'});
  });
}
function openScene(){
  const g=Object.keys(THEMES).map(k=>{const t=THEMES[k];return '<button class="sc'+(!S.auto&&S.scene===k?' on':'')+'" data-k="'+k+'" style="--c:'+t.c+'"><b>'+t.n+'</b><small>'+t.d+'</small></button>'}).join('');
  openSheet('صحنه‌ی ویژوالایزر','<div class="scn">'+g+'</div>'+swH('auto','صحنه‌ی خودکار برای هر آهنگ','هر آهنگ یک صحنه‌ی متفاوت می‌گیرد',S.auto)+swH('lite','حالت سبک','رزولوشن کمتر؛ برای گوشی‌های ضعیف',S.lite),
   b=>{wireSheet(b,{},()=>{applyTheme()});b.querySelectorAll('.sc').forEach(s=>s.onclick=()=>{S.scene=s.dataset.k;S.auto=false;saveS();applyTheme();openScene()})});
}
function openAdd(){
  openSheet('افزودن آهنگ','<div class="line" id="aScan"><div class="info"><b>'+(N?'اسکن دوباره‌ی موزیک گوشی':'انتخاب فایل‌های صوتی')+'</b><small>'+(N?'آهنگ‌های جدید به کتابخانه می‌آیند':'از حافظه‌ی دستگاه')+'</small></div></div>'+(N?'<div class="line" id="aFile"><div class="info"><b>انتخاب فایل مشخص</b></div></div>':''),
   b=>{b.querySelector('#aScan').onclick=()=>{closeSheet();if(N)loadLibrary(true);else $('file').click()};const f=b.querySelector('#aFile');if(f)f.onclick=()=>{closeSheet();$('file').click()}});
}

// ---------- mood view ----------
function renderMood(){
  const done=LIB.filter(t=>AN[t.id]&&AN[t.id][0]).length,total=LIB.length;
  const prog=anState.run?'<div class="bar" style="margin-top:10px"><i style="width:'+(anState.total?anState.done/anState.total*100:0)+'%"></i></div><small style="color:var(--mut)">'+fa(anState.done)+' از '+fa(anState.total)+'</small>':'';
  let h='<div class="card"><b>تحلیل کتابخانه</b><div style="color:var(--mut);font-size:12px;margin:4px 0 10px">NYXORA ضرب، انرژی و روشنی هر آهنگ را از خود صدا درمی‌آورد (تقریبی) و میکس مود را از روی آن می‌سازد. '+fa(done)+' از '+fa(total)+' آهنگ تحلیل شده.</div><button class="btn" id="anBtn">'+(anState.run?'توقف':(done<total?'شروع تحلیل':'تحلیل دوباره‌ی آهنگ‌های جدید'))+'</button>'+prog+'</div>';
  h+='<div class="mgrid">'+MOODS.map(m=>'<button class="mc'+(S.mood===m.id?' on':'')+'" data-m="'+m.id+'" style="--c:'+m.c+'">'+ic(m.i)+'<b>'+m.n+'</b><small>'+m.d+'</small></button>').join('')+'</div>';
  h+='<div class="card"><b>نقشه‌ی کتابخانه</b><div style="color:var(--mut);font-size:12px">افقی: BPM · عمودی: انرژی. روی هر نقطه بزن تا پخش شود.</div><canvas id="map" style="width:100%;height:230px;margin-top:8px;border-radius:14px;background:rgba(255,255,255,.04);touch-action:manipulation"></canvas></div>';
  $('moodBox').innerHTML=h;fillIcons($('moodBox'));
  $('anBtn').onclick=()=>{if(!LIB.length){toast('اول آهنگ اضافه کن');return}analyzeAll(()=>{if(view==='mood')renderMood()});setTimeout(renderMood,50)};
  $('moodBox').querySelectorAll('.mc').forEach(b=>b.onclick=()=>{
    const m=MOODS.find(x=>x.id===b.dataset.m);const l=moodList(m);
    if(l.length<6){toast('اول تحلیل کتابخانه را اجرا کن (حداقل ۶ آهنگ)');return}
    S.mood=m.id;saveS();playQueue(l,0);toast('میکس '+m.n+' · '+fa(l.length)+' آهنگ');renderMood();
  });
  drawMap();
}
let mapPts=[];
function drawMap(){
  const cv=$('map');if(!cv)return;const st={c:null,w:0,h:0,dpr:1};sizeCanvas(cv,st);const c=st.c,w=st.w,h=st.h;c.clearRect(0,0,w,h);
  c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=1;for(let i=1;i<4;i++){c.beginPath();c.moveTo(w*i/4,0);c.lineTo(w*i/4,h);c.moveTo(0,h*i/4);c.lineTo(w,h*i/4);c.stroke()}
  mapPts=[];
  for(const t of LIB){const a=AN[t.id];if(!a||!a[0])continue;
    const x=clamp((a[0]-60)/120)*(w-24)+12,y=h-12-clamp(a[1])*(h-24);
    let best=MOODS[0],bd=1e9;for(const m of MOODS){const d=((a[0]-m.t[0])/38)**2+((a[1]-m.t[1])/.3)**2;if(d<bd){bd=d;best=m}}
    c.fillStyle=rgba(best.c,0.85);c.beginPath();c.arc(x,y,3.2,0,7);c.fill();mapPts.push([x,y,t]);
  }
  c.fillStyle='rgba(255,255,255,.4)';c.font='10px sans-serif';c.fillText('BPM →',w-40,h-3);
  cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let b=null,bd=26*26;for(const p of mapPts){const d=(p[0]-x)**2+(p[1]-y)**2;if(d<bd){bd=d;b=p}}if(b){const l=mapPts.map(p=>p[2]);playQueue(l,l.indexOf(b[2]));toast(b[2].t)}};
}

// ---------- stats view ----------
function renderStats(){
  const hrs=Math.floor(ST.sec/3600),mn=Math.floor(ST.sec%3600/60);
  let tp=0;for(const k in ST.plays)tp+=ST.plays[k];
  const top=LIB.filter(t=>ST.plays[t.id]).sort((a,b)=>ST.plays[b.id]-ST.plays[a.id]).slice(0,6);
  const am={};for(const t of LIB){const p=ST.plays[t.id];if(p)am[t.a||'ناشناس']=(am[t.a||'ناشناس']||0)+p}
  const ar=Object.entries(am).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const bar=(n,s,v,mx)=>'<div style="padding:7px 0"><div style="display:flex;justify-content:space-between"><b class="t1" style="font-size:14px;max-width:70%">'+esc(n)+'</b><span style="font:600 12px var(--mono);color:var(--mut)">'+fa(v)+' بار</span></div>'+(s?'<div class="t2">'+esc(s)+'</div>':'')+'<div class="bar" style="margin-top:5px"><i style="width:'+(v/mx*100)+'%"></i></div></div>';
  let bpmAvg=0,bn=0;for(const t of LIB){const a=AN[t.id];if(a&&a[0]&&ST.plays[t.id]){bpmAvg+=a[0]*ST.plays[t.id];bn+=ST.plays[t.id]}}
  let h='<div class="kp"><div><b>'+(hrs?fa(hrs)+':'+fa(String(mn).padStart(2,'0')):fa(mn)+'د')+'</b><span>'+(hrs?'ساعت شنیدن':'دقیقه شنیدن')+'</span></div><div><b>'+fa(tp)+'</b><span>پخش کامل</span></div><div><b>'+fa(streak())+'</b><span>روز پشت‌هم</span></div></div>';
  if(bn)h+='<div class="card"><b>سلیقه‌ی تو</b><div style="color:var(--mut);margin-top:4px">میانگین ضرب آهنگ‌هایی که می‌شنوی حدود <b style="color:var(--a)">'+fa(Math.round(bpmAvg/bn))+' BPM</b> است.</div></div>';
  h+='<div class="card"><b>پرشنیده‌ترین‌ها</b>'+(top.length?top.map(t=>bar(t.t,t.a,ST.plays[t.id],ST.plays[top[0].id])).join(''):'<div style="color:var(--mut);padding:10px 0">هنوز آماری نیست. هر آهنگ بعد از ۳۰ ثانیه شنیدن یک بار حساب می‌شود.</div>')+'</div>';
  if(ar.length)h+='<div class="card"><b>خواننده‌های محبوب</b>'+ar.map(a=>bar(a[0],'',a[1],ar[0][1])).join('')+'</div>';
  if(tp||ST.sec)h+='<div style="padding:10px 16px"><button class="btn o" id="rs">صفر کردن آمار</button></div>';
  $('statBox').innerHTML=h;const r=$('rs');if(r)r.onclick=()=>{ST.plays={};ST.sec=0;ST.days=[];saveST();renderStats()};
}

// ---------- music profile ----------

  const t=cur();
  const total=LIB.length, fav=FAV.size;
  const cover=t&&typeof t.id==='number'?'<img src="/art/'+t.id+'" onerror="this.remove()">':'';
  let h='<div class="profile-hero"><div class="profile-art">'+(cover||ic('music'))+'</div><div class="profile-copy"><div class="eyebrow">YOUR MUSIC SPACE</div><b>'+(t?esc(t.t):'موسیقی تو، دنیای تو')+'</b><span>'+(t?esc(t.a||'هنرمند ناشناس'):'یک آهنگ انتخاب کن تا پروفایل پخش نمایش داده شود')+'</span><small>'+(t?esc(t.al||'آلبوم ثبت نشده'):'NYXORA · PERSONAL PLAYER')+'</small></div></div>';
  h+='<div class="profile-stats"><div><b>'+fa(total)+'</b><span>آهنگ در کتابخانه</span></div><div><b>'+fa(fav)+'</b><span>علاقه‌مندی</span></div><div><b>'+fa(Object.keys(ST.plays||{}).length)+'</b><span>آهنگ شنیده‌شده</span></div></div>';
  h+='<div class="card profile-actions"><b>دسترسی سریع</b><button class="line-action" id="pFav">'+ic('heart')+'<span>علاقه‌مندی‌ها</span>'+ic('next')+'</button><button class="line-action" id="pQueue">'+ic('queue')+'<span>صف پخش</span>'+ic('next')+'</button><button class="line-action" id="pShare">'+ic('orbit')+'<span>اشتراک‌گذاری آهنگ فعلی</span>'+ic('next')+'</button><button class="line-action" id="pLib">'+ic('music')+'<span>رفتن به کتابخانه</span>'+ic('next')+'</button><button class="line-action" id="pSettings">'+ic('gear')+'<span>تنظیمات پخش</span>'+ic('next')+'</button></div>';
  if(t)h+='<div class="card"><b>در حال پخش</b><div class="t2" style="margin-top:5px">با لمس کاور، صفحه پخش کامل باز می‌شود.</div><button class="btn" id="pOpen" style="margin-top:12px">نمایش آهنگ</button></div>';
  $('profileBox').innerHTML=h;
  $('pFav').onclick=()=>{S.filt='fav';saveS();showView('lib');renderChips()};
  $('pQueue').onclick=openQueue;
  $('pShare').onclick=()=>{if(!t)return toast('اول یک آهنگ پخش کن');if(N&&N.share)N.share('NYXORA · '+t.t,t.t+' — '+(t.a||'ناشناس'));else toast('اشتراک‌گذاری در این نسخه در دسترس نیست')};
  $('pLib').onclick=()=>showView('lib');$('pSettings').onclick=()=>showView('set');
  const po=$('pOpen');if(po)po.onclick=openNP;
}

// ---------- settings view ----------
function renderSet(){
  const sc=(THEMES[S.scene]||THEMES.ring).n;
  const ln=(t,s,r)=>'<div class="line"><div class="info"><b>'+t+'</b>'+(s?'<small>'+s+'</small>':'')+'</div>'+(r||'')+'</div>';
  let h='<div class="card"><div class="sec" style="padding-top:0">ظاهر</div>'
   +'<button class="line" style="width:100%;text-align:right" id="sScene">'+'<div class="info"><b>صحنه‌ی ویژوالایزر</b><small>'+(S.auto?'خودکار برای هر آهنگ':sc)+'</small></div></button>'
   +swH('amoled','پس‌زمینه‌ی مشکی AMOLED','مشکی کامل؛ باتری کمتر روی صفحه‌ی OLED',S.amoled)
   +ln('نرخ فریم','۳۰ کم‌مصرف‌تر است','<div class="pr" style="margin:0"><button class="chip'+(S.fps===30?' on':'')+'" data-fps="30">۳۰</button><button class="chip'+(S.fps===60?' on':'')+'" data-fps="60">۶۰</button></div>')
   +swH('lite','حالت سبک','رزولوشن کمتر؛ برای گوشی‌های ضعیف',S.lite)
   +'<div class="sec">حس موسیقی</div>'
   +swH('beatHap','لرزش با ضرب','با ضرب واقعی آهنگ می‌لرزد (فقط وقتی صفحه روشن است)',S.beatHap)
   +swH('beatFlash','فلش ضرب','روی هر ضرب یک سوسوی رنگی',S.beatFlash)
   +swH('shake','تکان بده تا آهنگ بعدی','گوشی را محکم تکان بده',S.shake)
   +'<div class="sec">صدا</div>'+swH('comp','نرمال‌ساز و فشرده‌ساز','صدای آرام و بلند را یکدست می‌کند',S.comp)
   +'<button class="line" style="width:100%;text-align:right" id="sFx"><div class="info"><b>اکولایزر و افکت‌ها</b><small>۱۰ باند · ۸D · ریورب · Slowed</small></div></button>'
   +'<div class="sec">کتابخانه</div>'
   +'<button class="line" style="width:100%;text-align:right" id="sScan"><div class="info"><b>'+(N?'اسکن دوباره':'انتخاب فایل')+'</b><small>'+fa(LIB.length)+' آهنگ</small></div></button>'
   +'<button class="line" style="width:100%;text-align:right" id="sClr"><div class="info"><b>پاک کردن نتیجه‌ی تحلیل</b><small>BPM و موج آهنگ‌ها دوباره ساخته می‌شود</small></div></button></div>'
   +'<div class="card"><b>درباره‌ی NYXORA</b><div style="color:var(--mut);margin-top:6px;font-size:12.5px;line-height:1.9">ویژوالایزر و تشخیص ضرب از روی طیف واقعی صدا ساخته می‌شوند. BPM و انرژی هر آهنگ تقریبی است و ممکن است گاهی نصف یا دو برابر باشد. اکولایزر، ۸D و ریورب روی خود صدا اعمال می‌شوند.</div></div>';
  $('setBox').innerHTML=h;
  wireSheet($('setBox'),{},k=>{if(k==='amoled')applyTheme();if(k==='shake')setShake()});
  $('sScene').onclick=openScene;$('sFx').onclick=openFx;$('sScan').onclick=()=>N?loadLibrary(true):$('file').click();
  $('sClr').onclick=()=>{for(const k in AN)delete AN[k];saveAN();SV('an',{});decodePk(cur());toast('پاک شد')};
  $('setBox').querySelectorAll('[data-fps]').forEach(b=>b.onclick=()=>{S.fps=+b.dataset.fps;saveS();renderSet()});
}
// shake
let shOn=false,shLast=0,shHits=0;
function setShake(){
  if(S.shake&&!shOn){shOn=true;window.addEventListener('devicemotion',shakeH)}
  else if(!S.shake&&shOn){shOn=false;window.removeEventListener('devicemotion',shakeH)}
}
function shakeH(e){
  const a=e.accelerationIncludingGravity;if(!a)return;
  const g=Math.sqrt((a.x||0)**2+(a.y||0)**2+(a.z||0)**2);const n=Date.now();
  if(g>26){if(n-shLast>150){shHits++;shLast=n;if(shHits>=3&&cur()){shHits=0;next();toast('تکان! آهنگ بعدی')}}}
  else if(n-shLast>700)shHits=0;
}

// ---------- back / main loop ----------
window.__back=function(){
  if($('sheet').classList.contains('on')){closeSheet();return true}
  if($('car').classList.contains('on')){$('car').classList.remove('on');return true}
  if($('np').classList.contains('on')){closeNP();return true}
  if(view!=='lib'){showView('lib');return true}
  return false;
};
let lastTs=0,fr=0;
function frame(ts){
  requestAnimationFrame(frame);
  const minDt=1000/(S.fps||60)-2;if(ts-lastTs<minDt)return;
  const dt=Math.min(0.05,(ts-lastTs)/1000||0.016);lastTs=ts;fr++;
  const np=$('np').classList.contains('on'),mini=$('mini').classList.contains('on'),car=$('car').classList.contains('on');
  if(np||mini||car){A.dt=dt;A.t=ts/1000;analyse(ts)}
  if(np){
    drawScene(dt,ts/1000);drawWave(ts/1000);
    const d=el.duration||0;$('tCur').textContent=fmt(dragF!=null?dragF*d:el.currentTime);$('tDur').textContent=fmt(d);
    $('tAb').textContent=ab.a!=null?('A '+fmt(ab.a)+(ab.b!=null?' ← B '+fmt(ab.b):'')):'';
    if(fr%6===0){const ab0=AN[cur()&&cur().id];$('bpmV').textContent=(A.bpm||(ab0&&ab0[0])||'—')===('—')?'— BPM':fa(A.bpm||ab0[0])+' BPM';$('pBpm').classList.toggle('beat',A.beat>0.5)}
  }
  else if(mini){drawMini()}
  if(mini){const d=el.duration||0;$('mPb').style.width=(d?clamp(el.currentTime/d)*100:0)+'%'}
}
requestAnimationFrame(frame);
// boot
syncMode();renderChips();applyTheme();setShake();renderList();
$('mPP').innerHTML=ic('play');$('bPP').innerHTML=ic('play');$('cPP').innerHTML=ic('play');
loadLibrary(true);
window.__ny={S,A,AN,ST,LIB:()=>LIB,Q:()=>Q,cur,el,playQueue,next,prev,togglePlay,openFx,openScene,showView,analyzeSamples,analyzeTrack,moodList,applyFx,G:()=>G,setLib,renderList,punch,openNP,closeNP,renderMood,renderStats,renderSet,sceneKey,anState,analyzeAll};

</script></body></html>
